<!doctype html>
<!--
  Markup for the trailer overlays. render_overlays.mjs opens this page once, then
  for each overlay clones a <template>, fills in its content and screenshots the page.
  Open this file in a browser to see the styling work; call
  fillTemplate("caption", { p: ["Hello *world*"] }) in the console to try one.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="overlays.css" />
  </head>
  <body>
    <div id="stage"></div>

    <template id="caption"><div class="caption"><p></p></div></template>
    <template id="chip"><div class="chip"><span class="icon"></span><span class="text"></span></div></template>
    <template id="badge"><div class="badge"></div></template>
    <template id="backdrop"><div class="backdrop"></div></template>
    <template id="callout-design">
      <div class="callout col-0">
        <header><span class="title"></span><span class="tag">Illustrative</span></header>
        <div class="sample">
          <div class="sample-bar"><span class="sample-name"></span></div>
          <div class="sample-body">
            <div class="sample-label">Full name</div>
            <div class="sample-input"></div>
            <div class="sample-alert"></div>
            <div class="sample-buttons"><span class="sample-primary"></span><span class="sample-secondary"></span></div>
          </div>
        </div>
      </div>
    </template>
    <template id="callout-blur">
      <div class="callout col-1">
        <header><span class="title"></span><span class="tag">Illustrative</span></header>
        <div class="doc"></div>
        <div class="alert"><span class="mark">!</span><span class="alert-text"></span></div>
      </div>
    </template>
    <template id="callout-portal">
      <div class="callout col-2">
        <header><span class="title"></span><span class="tag">Illustrative</span></header>
        <div class="fields">
          <div class="field f0"><label></label><div class="val"></div></div>
          <div class="field f1"><label></label><div class="val"></div></div>
          <div class="field f2"><label></label><div class="val"></div></div>
          <div class="field f3"><label></label><div class="val"></div></div>
        </div>
        <div class="button"></div>
      </div>
    </template>
    <template id="title-card"><div class="card"><div class="logo"></div><h1></h1><div class="sub"></div></div></template>
    <template id="end-card"><div class="card"><div class="logo"></div><h1></h1><div class="repo"></div></div></template>

    <script src="overlays.js"></script>
  </body>
</html>
