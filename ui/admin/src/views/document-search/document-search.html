<div class="filter-layout filter-layout--doc-viewer">
  <div class="filter-sidebar filter-sidebar--wide">
    <nav class="sidebar-tab-bar">
      <button class="sidebar-tab active" data-tab="filters">Filters</button>
      <button class="sidebar-tab" data-tab="results" disabled>Results</button>
    </nav>

    <div id="doc-search-tab-filters" class="metrics-tab-panel">
      <div class="metrics-timeframe">
        <label class="metrics-timeframe-label">Tenant <span class="required-star">*</span></label>
        <select id="tenant-select"></select>
      </div>
      <p id="doc-search-tenant-msg" class="field-error hidden">Select a tenant to search.</p>
      <div class="metrics-timeframe">
        <label class="metrics-timeframe-label">Filename</label>
        <input type="text" id="doc-search-filename" placeholder="contains…" />
      </div>
      <div class="metrics-timeframe">
        <label class="metrics-timeframe-label">Date Range</label>
        <div id="doc-search-date-range"></div>
      </div>
      <div class="metrics-timeframe">
        <label class="metrics-timeframe-label">Tenant-Provided Category</label>
        <select id="doc-search-doc-type">
          <option value="">Any</option>
        </select>
      </div>
      <div class="metrics-timeframe">
        <label class="metrics-timeframe-label">Document Type</label>
        <div id="doc-search-blueprint"></div>
      </div>
      <button id="doc-search-btn" class="btn-primary" style="width: 100%; margin-top: 0.5rem">
        Search
      </button>
      <button
        id="doc-search-clear-btn"
        class="btn-secondary"
        style="width: 100%; margin-top: 0.5rem"
      >
        Clear
      </button>
    </div>

    <div id="doc-search-tab-results" class="metrics-tab-panel hidden">
      <p id="no-documents" class="empty-state hidden"></p>
      <ul id="documents-list" class="documents-compact-list"></ul>
      <button
        id="doc-search-load-more"
        class="btn-secondary hidden"
        style="width: 100%; margin-top: 0.5rem"
      >
        Load more
      </button>
    </div>
  </div>

  <div class="filter-main">
    <div id="doc-viewer-pane"></div>
  </div>
</div>
