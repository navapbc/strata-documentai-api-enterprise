<div class="filter-layout filter-layout--doc-viewer">
  <div class="filter-sidebar">
    <div class="metrics-timeframe">
      <label class="metrics-timeframe-label">Tenant</label>
      <select id="tenant-select">
        <option value="">All Tenants</option>
      </select>
    </div>
    <div class="metrics-timeframe">
      <label class="metrics-timeframe-label">Status</label>
      <select id="document-status-filter">
        <option value="">All statuses</option>
        <option value="success">Success</option>
        <option value="no_custom_blueprint_matched">No Blueprint Matched</option>
        <option value="failed">Failed</option>
        <option value="conversion_failed">Conversion Failed</option>
        <option value="blurry_document_detected">Blurry Document</option>
        <option value="no_document_detected">No Document Detected</option>
        <option value="password_protected">Password Protected</option>
        <option value="started">Processing</option>
        <option value="not_started">Pending</option>
        <option value="deleted">Deleted</option>
      </select>
    </div>
    <p id="no-documents" class="empty-state hidden"></p>
    <ul id="documents-list" class="documents-compact-list"></ul>
  </div>
  <div class="filter-main">
    <div id="doc-viewer-pane"></div>
  </div>
</div>
