<div class="usage-view filter-layout">
  <div class="filter-sidebar">
    <div class="metrics-timeframe">
      <label class="metrics-timeframe-label">Tenant</label>
      <select id="tenant-select">
        <option value="">All Tenants</option>
      </select>
    </div>
    <div class="metrics-timeframe">
      <label class="metrics-timeframe-label">Year</label>
      <select id="usage-year"></select>
    </div>
    <div class="metrics-timeframe">
      <label class="metrics-timeframe-label">Month</label>
      <select id="usage-month">
        <option value="01">January</option>
        <option value="02">February</option>
        <option value="03">March</option>
        <option value="04">April</option>
        <option value="05">May</option>
        <option value="06">June</option>
        <option value="07">July</option>
        <option value="08">August</option>
        <option value="09">September</option>
        <option value="10">October</option>
        <option value="11">November</option>
        <option value="12">December</option>
      </select>
    </div>
    <div class="metrics-timeframe">
      <label class="metrics-timeframe-label">Granularity</label>
      <select id="usage-granularity">
        <option value="monthly">Monthly</option>
        <option value="daily">Daily</option>
      </select>
    </div>
  </div>
  <div class="filter-main">
    <div class="usage-table-header">
      <button id="usage-download-btn" class="btn-primary hidden" disabled>Download CSV</button>
    </div>
    <div id="usage-table-container">
      <p id="usage-empty" class="empty-state">Loading...</p>
    </div>
  </div>
</div>
