<div class="metrics-view">
  <div class="metrics-layout">
    <div class="metrics-sidebar">
      <div class="metrics-timeframe">
        <select id="metrics-timeframe">
          <option value="1">Yesterday</option>
          <option value="7">Last 7 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="90">Last 90 days</option>
          <option value="custom">Custom</option>
        </select>
        <div id="metrics-custom-range" class="metrics-custom-range hidden">
          <div class="metrics-custom-field">
            <label for="metrics-start">Start</label>
            <input type="date" id="metrics-start" />
          </div>
          <div class="metrics-custom-field">
            <label for="metrics-end">End</label>
            <input type="date" id="metrics-end" />
          </div>
          <button id="metrics-load-btn" class="btn-primary">Load</button>
        </div>
      </div>
      <nav class="metrics-tabs">
        <button class="metrics-tab active" data-tab="volume">Volume</button>
        <button class="metrics-tab" data-tab="outcomes">Outcomes</button>
        <button class="metrics-tab" data-tab="timing">Timing</button>
      </nav>
    </div>
    <div class="metrics-main">
      <div id="metrics-tab-volume" class="metrics-tab-panel"></div>
      <div id="metrics-tab-outcomes" class="metrics-tab-panel hidden"></div>
      <div id="metrics-tab-timing" class="metrics-tab-panel hidden"></div>
      <p id="metrics-empty" class="empty-state hidden"></p>
    </div>
  </div>
</div>
