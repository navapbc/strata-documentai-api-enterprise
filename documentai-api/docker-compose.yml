services:
  documentai-api:
    build:
      context: .
      target: dev
    ports:
      - 8000:8000
    volumes:
      - .:/app
      # Use named volumes for directories that the container should use the guest
      # machine's dir instead of the host machine's dir, which may be divergent.
      # This is especially true for any dependency or temp directories.
      - documentai-api_venv:/app/.venv
      - ../docs:/docs
      # Read-only mount of host AWS credentials - only used if AWS_PROFILE is set
      # and .env points DOCUMENTAI_*/BDA_* at real AWS resources. See
      # docs/documentai-api/accessing-real-aws-resources-from-docker.md.
      - ~/.aws:/root/.aws:ro
    env_file:
      - path: .env
        required: false
    environment:
      - AWS_PROFILE

volumes:
  documentai-api_venv:
